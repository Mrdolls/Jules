            if ( (inputs.distanceToLeftWall <= 0.01 && action === 3) || // action was 'left'

                 (inputs.distanceToTopWall <= 0.01 && action === 2) ||   // action was 'up'
                 (inputs.distanceToBottomWall <= 0.01 && action === 4) ) { // action was 'down'
                isMajorPenaltyApplied = true;
            }

            // Vérifier si la pénalité de non-collecte a été appliquée

            if (typeof stepsSinceLastCollection !== 'undefined' &&
                typeof MAX_STEPS_WITHOUT_COLLECTION !== 'undefined' && // Added check for MAX_STEPS_WITHOUT_COLLECTION

                stepsSinceLastCollection[individualIndex] > MAX_STEPS_WITHOUT_COLLECTION) {
                isMajorPenaltyApplied = true;
            }

            if (!isMajorPenaltyApplied) {
                reward += SURVIVAL_REWARD;
            }
            // --- FIN DE L'AJOUT ---
